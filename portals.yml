# Portal Scanner Configuration — Venkata Lakshmi Parimala Pasupuleti
# Primary targets: AI Engineer, Forward Deployed Engineer, Software Engineer — PropTech / multifamily / HUD / LIHTC
# Secondary targets: Solutions Engineer, Applied AI Engineer, Agentic Analytics Engineer
# Market: United States (remote, hybrid, Virginia/DC area preferred)
# Visa: F-1 STEM OPT → H-1B; prefer established sponsors
#
# Scan strategy:
#   0. Local parser → per-company parser script (zero-token)
#   1. Greenhouse / Ashby / Lever API → zero-token JSON (tracked_companies)
#   2. WebSearch → search_queries section (broad discovery)
#   3. Playwright → paste URL into data/pipeline.md, run /career-ops pipeline

# -- Location filter --
