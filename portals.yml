# -- Title filter --
# Focus (updated 2026-09-28): AI Engineer + FDE + SWE — PropTech / multifamily / HUD / LIHTC primary
# HARD BLOCK: SWE infra, ML infra, DevOps, frontend, cleared roles, Data Analyst
title_filter:
  positive:
    # -- TIER 1: AI/FDE/SWE at PropTech/multifamily companies --
    - "AI Engineer"
    - "Applied AI Engineer"
    - "Forward Deployed Engineer"
    - "Solutions Engineer"
    - "Software Engineer"
    - "LLM Engineer"
    - "GenAI Engineer"
    - "Agentic AI Engineer"
    - "Agentic Analytics Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    # -- TIER 2: Adjacent roles worth screening --
    - "Solutions Architect"
    - "Implementation Engineer"
    - "Customer Engineer"
    - "AI Solutions"
    - "Analytics Engineer"
    - "Platform Engineer"
    - "Product Engineer"
  negative:
    - "Intern"
    - "iOS"
    - "Android"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Java "
    - ".NET"
    - "C#"
    - "SAP "
    - "Security Clearance"
    - "TS/SCI"
    - "Cleared"
    - "Frontend Engineer"
    - "Frontend Developer"
    - "React Engineer"
    - "DevOps Engineer"
    - "Site Reliability"
    - "SRE"
    - "Network Engineer"
    - "QA Engineer"
    - "Test Engineer"
    - "Manager"
    - "Director"
    - "VP of"
    - "ML Platform Engineer"
    - "ML Infrastructure"
    - "Business Analyst"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Head"
    - "Associate"
    - "Junior"
  seniority_block:                 # Hard block at Staff+ for MLE/infra titles
    - "Staff Machine Learning"
    - "Principal Machine Learning"
    - "Staff ML"
    - "Principal ML"

